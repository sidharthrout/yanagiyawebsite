name: Deploy to Xserver FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy to Xserver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Upload directly to the FTP root, as that is the web root
          server-dir: ./
          # Never upload raw sources, backups, or admin tooling (160MB+ of JPEGs, backups, PHP admin)
          exclude: |
            **/.git*
            **/.github/**
            **/backup/**
            **/images jpeg/**
            **/table/**
