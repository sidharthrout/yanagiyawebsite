<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Yanagiya Guest House</title>
  
  <meta property="og:title" content="Page Not Found | Yanagiya Guest House" />
  <meta property="og:description" content="The path you're looking for doesn't exist on the Nakasendo." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="logo.webp" type="image/png" />
  <link rel="apple-touch-icon" href="logo.png" />

  <!-- Analytics (Plausible — privacy-friendly, no cookies) -->
  <script defer data-domain="yanagiyawebsite" src="https://plausible.io/js/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #151210;
      --paper: #f7f4ee;
      --gold: #c29d5b;
      --muted: #66605b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      line-height: 1.6;
      text-align: center;
      padding: 0 1.5rem;
    }

    /* Header / Nav */
    header {
      padding: 2.5rem 1rem 1rem;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--ink);
      transition: opacity 0.3s ease;
    }

    .brand:hover {
      opacity: 0.8;
    }

    .brand-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .brand-jp {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.25em;
      margin-top: 0.15rem;
    }

    /* Center Content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .error-card {
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .error-code {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .kanji-hero {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.15em;
      color: var(--ink);
      margin-bottom: 1.25rem;
      opacity: 0.9;
      user-select: none;
    }

    .divider {
      width: 48px;
      height: 1px;
      background-color: var(--gold);
      margin: 0.5rem auto 1.75rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }

    p.description {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      max-width: 420px;
      font-weight: 300;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background-color: var(--ink);
      color: var(--paper);
      padding: 0.9rem 2.2rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(21, 18, 16, 0.08);
    }

    .btn-home:hover {
      background-color: var(--gold);
      color: var(--ink);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(194, 157, 91, 0.25);
    }

    /* Footer */
    footer {
      padding: 2.5rem 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      .btn-home {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand" aria-label="Yanagiya Homepage">
      <span class="brand-en">Yanagiya</span>
      <span class="brand-jp">柳屋 · 馬籠宿</span>
    </a>
  </header>

  <main>
    <div class="error-card">
      <span class="error-code">404 Error</span>
      <div class="kanji-hero" aria-label="迷子 (Lost)">迷子</div>
      <div class="divider"></div>
      <h1>Page Not Found</h1>
      <p class="description">The path you're looking for doesn't exist on the Nakasendo.</p>
      <a href="index.html" class="btn-home">
        <span>← Return to Homepage</span>
      </a>
    </div>
  </main>

  <footer>
    <p>&#169; 2026 Yanagiya Guest House · Magome-juku, Nakasendo, Japan</p>
  </footer>

</body>
</html>
