<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yanagiya — スタッフ管理</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f4f2ef;
      --text: #2c2c2c;
      --accent: #8b6f47;
      --accent-light: #c4a882;
      --border: #e0d6c8;
      --card: #ffffff;
      --success: #4a7c59;
      --cancel-color: #b54a4a;
      --cancelled-bg: #f9f0f0;
      --cancelled-text: #c0392b;
      --sidebar-w: 220px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ============================================================
       PIN SCREEN
    ============================================================ */
    #pinScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .pin-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    .pin-logo {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .pin-label {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .pin-input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
    }

    .pin-input:focus { border-color: var(--accent); }

    .pin-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .pin-btn:hover { background: #7a6140; }

    .pin-error {
      font-size: 13px;
      color: var(--cancel-color);
      margin-top: 10px;
      min-height: 20px;
    }

    /* ============================================================
       APP LAYOUT (sidebar + main)
    ============================================================ */
    #app {
      display: none;
      min-height: 100vh;
    }

    /* ---- Overlay for mobile drawer ---- */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
    }

    /* ---- Sidebar ---- */
    #sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 210;
      transition: transform 0.25s ease;
    }

    .sidebar-logo {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo-name {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .sidebar-logo-sub {
      font-size: 10px;
      color: #bbb;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    nav {
      flex: 1;
      padding: 12px 0;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 500;
      color: #777;
      cursor: pointer;
      border-radius: 8px;
      margin: 2px 8px;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .nav-item:hover { background: var(--bg); color: var(--text); }

    .nav-item.active {
      background: #f5f0e8;
      color: var(--accent);
      font-weight: 600;
    }

    .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .logout-btn {
      width: 100%;
      font-size: 12px;
      color: #aaa;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .logout-btn:hover { color: var(--cancel-color); border-color: var(--cancel-color); }

    /* ---- Mobile top bar ---- */
    #topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar-logo {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .topbar-page {
      font-size: 13px;
      font-weight: 600;
      color: #888;
    }

    .hamburger {
      width: 36px;
      height: 36px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ---- Main content area ---- */
    #main {
      margin-left: var(--sidebar-w);
      padding: 28px 24px 60px;
      max-width: 860px;
    }

    /* ---- Responsive: hide sidebar on small screens ---- */
    @media (max-width: 700px) {
      #sidebar { transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      #topbar { display: flex; }
      #main { margin-left: 0; padding: 16px 14px 60px; }
    }

    /* ============================================================
       SHARED COMPONENTS
    ============================================================ */
    .page { display: none; }
    .page.active { display: block; }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 14px;
    }

    .no-data {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
      font-size: 14px;
    }

    /* ============================================================
       DASHBOARD
    ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    .stats-grid-2 {
      grid-template-columns: 1fr 1fr !important;
    }

    .stat-card-future {
      border-color: var(--accent-light);
      background: #fdf8f2;
    }

    .stat-card-future .stat-value {
      font-size: 36px;
      color: var(--accent);
    }

    .stat-card-future .stat-label {
      color: var(--accent-light);
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .stat-unit {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .dash-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .chart-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px 10px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 28px;
    }

    .bar-area {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: flex-end;
    }

    .bar-fill {
      width: 100%;
      background: var(--accent-light);
      border-radius: 4px 4px 0 0;
      min-height: 3px;
      transition: height 0.3s;
    }

    .bar-label {
      font-size: 10px;
      color: #aaa;
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
    }

    .bar-val {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      min-height: 15px;
    }

    .blocked-list {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ============================================================
       FORECAST TABLE
    ============================================================ */
    .forecast-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .forecast-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .forecast-table thead th {
      background: #fdfbf8;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .forecast-table tbody tr {
      border-bottom: 1px solid #f5f2ee;
    }

    .forecast-table tbody tr:last-child { border-bottom: none; }

    .forecast-table tbody td {
      padding: 11px 12px;
      vertical-align: middle;
    }

    .forecast-today {
      background: #fdf8f2;
    }

    .forecast-today td { font-weight: 600; }

    .forecast-date {
      white-space: nowrap;
      color: var(--text);
    }

    .forecast-num {
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }

    .forecast-guests { color: var(--success) !important; }

    .forecast-slot {
      color: #777;
      font-size: 12px;
      white-space: nowrap;
    }

    .today-chip {
      font-size: 10px;
      background: var(--accent);
      color: white;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      vertical-align: middle;
      margin-left: 4px;
    }

    @media (max-width: 480px) {
      .forecast-table { font-size: 12px; }
      .forecast-table thead th,
      .forecast-table tbody td { padding: 9px 8px; }
      .forecast-num { font-size: 14px; }
    }

    .blocked-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      border-bottom: 1px solid #f0ece6;
      font-size: 13px;
    }

    .blocked-item:last-child { border-bottom: none; }

    .blocked-info { color: var(--text); font-weight: 500; }
    .blocked-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 20px;
      background: #fff0f0;
      color: var(--cancel-color);
      border: 1px solid #f0c0c0;
    }

    /* ============================================================
       RESERVATION MANAGEMENT (予約管理)
    ============================================================ */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .date-nav-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .date-nav-btn:hover { border-color: var(--accent-light); }

    .date-label {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .today-btn {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: 1px solid var(--accent-light);
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .today-btn:hover { background: var(--accent); color: white; }

    .refresh-btn {
      font-size: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.3s;
    }

    .refresh-btn:hover { opacity: 1; transform: rotate(180deg); }

    .summary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .summary-card .s-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .summary-card .s-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .summary-card .s-unit {
      font-size: 13px;
      color: #999;
      margin-top: 4px;
    }

    .slot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #f0ece6;
      background: #fdfbf8;
    }

    .slot-time {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .slot-badges {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .badge-guests { background: #eef6f1; color: var(--success); border: 1px solid #c3dece; }
    .badge-full   { background: #fff0f0; color: var(--cancel-color); border: 1px solid #e8b4b4; }
    .badge-open   { background: #f0f7ff; color: #2980b9; border: 1px solid #b8d8f0; }
    .badge-block  { background: #fff8e8; color: #b07c10; border: 1px solid #f0d898; }

    .seat-status {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid #f0ece6;
    }

    .seat-item {
      padding: 10px 16px;
      font-size: 12px;
      color: #888;
      border-right: 1px solid #f0ece6;
    }

    .seat-item:last-child { border-right: none; }
    .seat-item .seat-name { font-weight: 600; color: #666; margin-bottom: 2px; }

    .res-list { padding: 8px 0; }

    .res-empty {
      text-align: center;
      padding: 20px;
      color: #bbb;
      font-size: 13px;
    }

    .res-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f8f5f0;
      gap: 8px;
    }

    .res-item:last-child { border-bottom: none; }
    .res-item.cancelled { background: var(--cancelled-bg); opacity: 0.65; }

    .res-info { flex: 1; min-width: 0; }
    .res-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .res-meta { font-size: 12px; color: #999; }

    .res-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tag-table6 { background: #fef6e4; color: #a07c2c; border: 1px solid #f0d898; }
    .tag-table2 { background: #eef4ff; color: #2c6aa0; border: 1px solid #b8d0f0; }

    .cancel-btn {
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid #e8b4b4;
      border-radius: 6px;
      background: white;
      color: var(--cancel-color);
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .cancel-btn:hover { background: #fff0f0; }

    .cancelled-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
      background: #f0e0e0;
      color: var(--cancelled-text);
      flex-shrink: 0;
    }

    /* ============================================================
       SLOT MANAGEMENT (空き枠管理)
    ============================================================ */
    .slot-mgmt-desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .slot-mgmt-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }

    .slot-mgmt-date {
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 600;
    }

    .slot-mgmt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 420px) {
      .slot-mgmt-grid { grid-template-columns: 1fr; }
    }

    .slot-mgmt-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .slot-mgmt-card.blocked {
      border-color: #f0c0c0;
      background: #fff8f8;
    }

    .slot-mgmt-time {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .slot-mgmt-status {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .slot-mgmt-status.is-blocked { color: var(--cancel-color); font-weight: 600; }

    .block-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }

    .block-btn:hover { opacity: 0.8; }
    .block-btn.do-block { background: #b54a4a; color: white; }
    .block-btn.do-unblock { background: var(--success); color: white; }
  </style>
</head>
<body>

  <!-- ============================================================
       PIN SCREEN
  ============================================================ -->
  <div id="pinScreen">
    <div class="pin-card">
      <div class="pin-logo">Yanagiya</div>
      <div class="pin-label">Staff Only</div>
      <input
        type="password"
        id="pinInput"
        class="pin-input"
        placeholder="PINコードを入力"
        maxlength="30"
        onkeydown="if(event.key==='Enter') login()"
        autocomplete="current-password"
      >
      <button class="pin-btn" onclick="login()">ログイン</button>
      <div class="pin-error" id="pinError"></div>
    </div>
  </div>

  <!-- ============================================================
       APP
  ============================================================ -->
  <div id="app">

    <!-- Overlay (mobile) -->
    <div id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-name">Yanagiya</div>
        <div class="sidebar-logo-sub">Staff Panel</div>
      </div>
      <nav>
        <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
          <span class="nav-icon">📊</span> ダッシュボード
        </div>
        <div class="nav-item" onclick="showPage('reservations')" id="nav-reservations">
          <span class="nav-icon">📋</span> 予約管理
        </div>
        <div class="nav-item" onclick="showPage('slots')" id="nav-slots">
          <span class="nav-icon">🗓</span> 空き枠管理
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>
    </aside>

    <!-- Mobile top bar -->
    <div id="topbar">
      <div class="topbar-logo">Yanagiya</div>
      <div class="topbar-right">
        <div class="topbar-page" id="topbarPage">ダッシュボード</div>
        <button class="hamburger" onclick="openSidebar()">☰</button>
      </div>
    </div>

    <!-- Main -->
    <main id="main">

      <!-- ---- DASHBOARD ---- -->
      <div class="page active" id="page-dashboard">
        <div class="page-title">ダッシュボード</div>
        <div id="dashContent"><div class="loading">読み込み中...</div></div>
      </div>

      <!-- ---- RESERVATIONS ---- -->
      <div class="page" id="page-reservations">
        <div class="page-title">予約管理</div>
        <div class="date-nav">
          <button class="date-nav-btn" onclick="resChangeDate(-1)">‹</button>
          <div class="date-label" id="resDateLabel">—</div>
          <button class="date-nav-btn" onclick="resChangeDate(1)">›</button>
          <button class="today-btn" onclick="resToday()">今日</button>
          <button class="refresh-btn" onclick="fetchReservations()" title="最新化">🔄</button>
        </div>
        <div id="resContent"><div class="loading">読み込み中...</div></div>
      </div>

      <!-- ---- SLOTS ---- -->
      <div class="page" id="page-slots">
        <div class="page-title">空き枠管理</div>
        <p class="slot-mgmt-desc">特定の日時を手動でブロック（受付停止）または解除できます。<br>ブロック中はお客様の予約ページにも「満席」と表示されます。</p>
        <div class="slot-mgmt-controls">
          <button class="date-nav-btn" onclick="slotChangeDate(-1)">‹</button>
          <div class="slot-mgmt-date" id="slotDateLabel">—</div>
          <button class="date-nav-btn" onclick="slotChangeDate(1)">›</button>
          <button class="today-btn" onclick="slotToday()">今日</button>
        </div>
        <div id="slotContent"><div class="loading">読み込み中...</div></div>
      </div>

    </main>
  </div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    // PINはここに書かない。検証はGAS側のみで行う。
    const PROXY_URL  = '/proxy.php';
    const DINNER_TIMES = ['17:30', '19:00'];
    const DAYS_JA    = ['日', '月', '火', '水', '木', '金', '土'];

    // ============================================================
    // STATE
    // ============================================================
    let enteredPin  = '';
    let resDate     = todayStr();
    let slotDate    = todayStr();
    let activePage  = 'dashboard';

    // ============================================================
    // UTILS
    // ============================================================
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function dateLabel(str) {
      const d   = new Date(str + 'T00:00:00');
      const tod = str === todayStr() ? ' — 今日' : '';
      return `${d.getMonth()+1}月${d.getDate()}日（${DAYS_JA[d.getDay()]}）${tod}`;
    }

    function shiftDate(str, delta) {
      const d = new Date(str + 'T00:00:00');
      d.setDate(d.getDate() + delta);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ============================================================
    // SIDEBAR (mobile)
    // ============================================================
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').style.display = 'block';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').style.display = 'none';
    }

    // ============================================================
    // PAGE NAVIGATION
    // ============================================================
    const PAGE_NAMES = { dashboard: 'ダッシュボード', reservations: '予約管理', slots: '空き枠管理' };

    function showPage(name) {
      closeSidebar();
      activePage = name;

      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById('page-' + name).classList.add('active');
      document.getElementById('nav-' + name).classList.add('active');
      document.getElementById('topbarPage').textContent = PAGE_NAMES[name];

      if (name === 'dashboard')    loadDashboard();
      if (name === 'reservations') { document.getElementById('resDateLabel').textContent = dateLabel(resDate); fetchReservations(); }
      if (name === 'slots')        { document.getElementById('slotDateLabel').textContent = dateLabel(slotDate); fetchSlots(); }
    }

    // ============================================================
    // PIN LOGIN / LOGOUT
    // ============================================================
    async function login() {
      const val = document.getElementById('pinInput').value.trim();
      if (!val) return;

      const btn = document.querySelector('.pin-btn');
      btn.disabled = true;
      btn.textContent = '確認中...';

      try {
        // GASにPINを送り、Unauthorizedでなければ正解
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_stats', key: val, from: '2000-01-01', to: '2000-01-01' })
        });
        const data = await res.json();

        if (data.error === 'Unauthorized') {
          document.getElementById('pinError').textContent = 'PINコードが正しくありません。';
          document.getElementById('pinInput').value = '';
          document.getElementById('pinInput').focus();
        } else {
          enteredPin = val;
          document.getElementById('pinScreen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          showPage('dashboard');
        }
      } catch(e) {
        document.getElementById('pinError').textContent = '通信エラーが発生しました。';
      } finally {
        btn.disabled = false;
        btn.textContent = 'ログイン';
      }
    }

    function logout() {
      enteredPin = '';
      document.getElementById('pinInput').value   = '';
      document.getElementById('pinError').textContent = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('pinScreen').style.display = 'flex';
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    async function loadDashboard() {
      const el = document.getElementById('dashContent');
      el.innerHTML = '<div class="loading">読み込み中...</div>';

      const today   = todayStr();
      const past7   = shiftDate(today, -6);
      const future7 = shiftDate(today, 7);

      try {
        // 過去7日＋今後すべてを一括取得（to=9999-12-31で無期限）
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_stats', key: enteredPin, from: past7, to: '9999-12-31' })
        });
        const data = await res.json();
        if (data.error === 'Unauthorized') { logout(); return; }
        if (!data.success) { el.innerHTML = '<div class="no-data">データ取得に失敗しました。</div>'; return; }
        renderDashboard(data, past7, today, future7);
      } catch(e) {
        el.innerHTML = '<div class="no-data">通信エラーが発生しました。</div>';
      }
    }

    function renderDashboard(data, from, today, futureTo) {
      const el = document.getElementById('dashContent');

      // ---- 過去集計
      const pastDays = [];
      for (let i = 0; i <= 6; i++) pastDays.push(shiftDate(from, i));
      const pastStats = pastDays.reduce((acc, d) => {
        const info = data.byDate[d] || {};
        if (d <= today) { acc.res += info.reservations || 0; acc.guests += info.guests || 0; }
        return acc;
      }, { res: 0, guests: 0 });

      // ---- 今後集計（今日以降 futureTo まで全日）
      const futureStats = { res: 0, guests: 0 };
      Object.keys(data.byDate).forEach(d => {
        if (d >= today) {
          futureStats.res    += data.byDate[d].reservations || 0;
          futureStats.guests += data.byDate[d].guests || 0;
        }
      });

      // ---- サマリー（今後を上段・過去を下段）
      let html = `
        <div class="dash-section-title">今後の予約合計</div>
        <div class="stats-grid stats-grid-2" style="margin-bottom:20px">
          <div class="stat-card stat-card-future">
            <div class="stat-label">予約組数（今後）</div>
            <div class="stat-value">${futureStats.res}</div>
            <div class="stat-unit">組</div>
          </div>
          <div class="stat-card stat-card-future">
            <div class="stat-label">来店人数（今後）</div>
            <div class="stat-value">${futureStats.guests}</div>
            <div class="stat-unit">名</div>
          </div>
        </div>
        <div class="dash-section-title">過去7日の実績</div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">予約数</div>
            <div class="stat-value">${pastStats.res}</div>
            <div class="stat-unit">件</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">来店人数</div>
            <div class="stat-value">${pastStats.guests}</div>
            <div class="stat-unit">名</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">キャンセル</div>
            <div class="stat-value">${data.cancelledCount}</div>
            <div class="stat-unit">件</div>
          </div>
        </div>
      `;

      // ---- 今後7日の仕入れ予測表（今日〜7日後）
      const futureDays = [];
      for (let i = 0; i <= 7; i++) futureDays.push(shiftDate(today, i));

      html += `<div class="dash-section-title">今後の予約（仕入れ目安）</div>`;
      html += `
        <div class="forecast-wrap">
          <table class="forecast-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>組数</th>
                <th>人数</th>
                <th>17:30</th>
                <th>19:00</th>
              </tr>
            </thead>
            <tbody>
      `;
      futureDays.forEach(d => {
        const info    = data.byDate[d] || { reservations: 0, guests: 0, byTime: {} };
        const t1730   = (info.byTime || {})['17:30'] || { reservations: 0, guests: 0 };
        const t1900   = (info.byTime || {})['19:00'] || { reservations: 0, guests: 0 };
        const date    = new Date(d + 'T00:00:00');
        const isToday = d === today;
        const isSat   = date.getDay() === 6;
        const isSun   = date.getDay() === 0;
        const dayColor = isSun ? 'color:#c0392b' : (isSat ? 'color:#2980b9' : '');
        const todayClass = isToday ? 'forecast-today' : '';
        const dlbl   = `${date.getMonth()+1}/${date.getDate()}（<span style="${dayColor}">${DAYS_JA[date.getDay()]}</span>）`;

        const fmt = (t) => t.guests > 0 ? `${t.reservations}組 / ${t.guests}名` : `<span style="color:#ccc">—</span>`;

        html += `
          <tr class="${todayClass}">
            <td class="forecast-date">${dlbl}${isToday ? ' <span class="today-chip">今日</span>' : ''}</td>
            <td class="forecast-num">${info.reservations > 0 ? info.reservations : '<span style="color:#ccc">0</span>'}</td>
            <td class="forecast-num forecast-guests">${info.guests > 0 ? info.guests : '<span style="color:#ccc">0</span>'}</td>
            <td class="forecast-slot">${fmt(t1730)}</td>
            <td class="forecast-slot">${fmt(t1900)}</td>
          </tr>
        `;
      });
      html += `</tbody></table></div>`;

      // ---- 棒グラフ（過去7日）
      const maxGuests = Math.max(1, ...pastDays.map(d => (data.byDate[d] || {}).guests || 0));
      html += `
        <div class="dash-section-title" style="margin-top:24px">日別来店人数（過去7日）</div>
        <div class="chart-wrap">
          <div class="bar-chart">
      `;
      pastDays.forEach(d => {
        const info = data.byDate[d] || { guests: 0 };
        const pct  = Math.round((info.guests / maxGuests) * 100);
        const date = new Date(d + 'T00:00:00');
        const lbl  = `${date.getMonth()+1}/${date.getDate()}`;
        html += `
          <div class="bar-col">
            <div class="bar-val">${info.guests || ''}</div>
            <div class="bar-area">
              <div class="bar-fill" style="height:${pct}%"></div>
            </div>
            <div class="bar-label">${lbl}<br>${DAYS_JA[date.getDay()]}</div>
          </div>
        `;
      });
      html += `</div></div>`;

      // ---- ブロック中スロット
      html += `<div class="dash-section-title" style="margin-top:24px">現在ブロック中の枠</div>`;
      if (data.blockedSlots.length === 0) {
        html += `<div class="blocked-list"><div class="blocked-item"><span class="blocked-info">ブロック中の枠はありません</span></div></div>`;
      } else {
        html += `<div class="blocked-list">`;
        data.blockedSlots.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).forEach(s => {
          const d    = new Date(s.date + 'T00:00:00');
          const dlbl = `${d.getMonth()+1}月${d.getDate()}日（${DAYS_JA[d.getDay()]}）`;
          html += `
            <div class="blocked-item">
              <span class="blocked-info">${dlbl} &nbsp; ${s.time}</span>
              <span class="blocked-badge">受付停止中</span>
            </div>
          `;
        });
        html += `</div>`;
      }

      el.innerHTML = html;
    }

    // ============================================================
    // RESERVATIONS
    // ============================================================
    function resToday()          { resDate = todayStr(); document.getElementById('resDateLabel').textContent = dateLabel(resDate); fetchReservations(); }
    function resChangeDate(d)    { resDate = shiftDate(resDate, d); document.getElementById('resDateLabel').textContent = dateLabel(resDate); fetchReservations(); }

    async function fetchReservations() {
      const el = document.getElementById('resContent');
      el.innerHTML = '<div class="loading">読み込み中...</div>';
      try {
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_reservations', date: resDate, key: enteredPin })
        });
        const data = await res.json();
        if (data.error === 'Unauthorized') { logout(); return; }
        if (!data.success) { el.innerHTML = '<div class="no-data">データの取得に失敗しました。</div>'; return; }
        renderReservations(data.reservations || [], data.slots || {});
      } catch(e) {
        el.innerHTML = '<div class="no-data">通信エラーが発生しました。</div>';
      }
    }

    function renderReservations(reservations, slots) {
      const el     = document.getElementById('resContent');
      const active = reservations.filter(r => r.status !== 'キャンセル');
      const totalGuests = active.reduce((s, r) => s + r.partySize, 0);

      let html = `
        <div class="summary-row">
          <div class="summary-card"><div class="s-label">来店予定人数</div><div class="s-value">${totalGuests}</div><div class="s-unit">名</div></div>
          <div class="summary-card"><div class="s-label">予約組数</div><div class="s-value">${active.length}</div><div class="s-unit">組</div></div>
        </div>
      `;

      DINNER_TIMES.forEach(time => {
        const slotRes   = reservations.filter(r => r.time === time);
        const activeRes = slotRes.filter(r => r.status !== 'キャンセル');
        const slotGuests = activeRes.reduce((s, r) => s + r.partySize, 0);
        const sd        = slots[time] || { table2: null, table6left: null, table6right: null, table6full: null, fullBooking: false, manualBlock: false };

        let seatHtml;
        if (sd.manualBlock) {
          seatHtml = `<div class="seat-item" style="grid-column:1/-1"><div class="seat-name">この枠は手動でブロック中</div><div>空き枠管理から解除できます</div></div>`;
        } else if (sd.fullBooking) {
          seatHtml = `<div class="seat-item" style="grid-column:1/-1"><div class="seat-name">全席</div><div>貸切 — 使用中</div></div>`;
        } else {
          seatHtml = [
            { label: '2名席',        val: sd.table2 },
            { label: '6名席（右）',  val: sd.table6right },
            { label: '6名席（左）',  val: sd.table6left },
            { label: '6名席（全体）',val: sd.table6full },
          ].map(s => `<div class="seat-item"><div class="seat-name">${s.label}</div><div>${s.val !== null ? s.val + '名 — 使用中' : '— 空き'}</div></div>`).join('');
        }

        const isFull = sd.manualBlock || !canAccommodate(sd, 1);
        const statusBadge = sd.manualBlock
          ? `<span class="badge badge-block">受付停止中</span>`
          : isFull
            ? `<span class="badge badge-full">満席</span>`
            : `<span class="badge badge-open">空きあり</span>`;

        html += `
          <div class="slot-card">
            <div class="slot-header">
              <div class="slot-time">${time}</div>
              <div class="slot-badges">
                <span class="badge badge-guests">👥 ${slotGuests}名 / ${activeRes.length}組</span>
                ${statusBadge}
              </div>
            </div>
            <div class="seat-status">${seatHtml}</div>
            <div class="res-list">
        `;

        if (slotRes.length === 0) {
          html += `<div class="res-empty">予約なし</div>`;
        } else {
          slotRes.forEach(r => {
            const isCancelled = r.status === 'キャンセル';
            const tableTag = r.table.includes('6')
              ? `<span class="res-tag tag-table6">${escapeHtml(r.table)}</span>`
              : `<span class="res-tag tag-table2">${escapeHtml(r.table)}</span>`;
            const actionEl = isCancelled
              ? `<span class="cancelled-badge">キャンセル済</span>`
              : `<button class="cancel-btn" onclick="cancelReservation(${r.rowIndex},'${r.date}','${r.time}',${r.partySize},'${r.table}','${escapeHtml(r.name)}')">キャンセル</button>`;
            html += `
              <div class="res-item ${isCancelled ? 'cancelled' : ''}">
                <div class="res-info">
                  <div class="res-name">${escapeHtml(r.name)} 様</div>
                  <div class="res-meta">${r.partySize}名 &nbsp;${tableTag}&nbsp; 受付: ${r.timestamp.substring(5,16)}</div>
                </div>
                ${actionEl}
              </div>
            `;
          });
        }
        html += `</div></div>`;
      });

      if (reservations.length === 0) {
        html += `<div class="no-data">この日の予約はありません</div>`;
      }

      el.innerHTML = html;
    }

    async function cancelReservation(rowIndex, date, time, partySize, table, name) {
      if (!confirm(`「${name} 様」(${partySize}名, ${time}) の予約をキャンセルしますか？\n\nこの操作は取り消せません。`)) return;
      try {
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_cancel', key: enteredPin, rowIndex, date, time, partySize, table })
        });
        const data = await res.json();
        if (data.success) fetchReservations();
        else alert('キャンセルに失敗しました: ' + (data.message || '不明なエラー'));
      } catch(e) {
        alert('通信エラーが発生しました。');
      }
    }

    // ============================================================
    // SLOT MANAGEMENT
    // ============================================================
    function slotToday()       { slotDate = todayStr(); document.getElementById('slotDateLabel').textContent = dateLabel(slotDate); fetchSlots(); }
    function slotChangeDate(d) { slotDate = shiftDate(slotDate, d); document.getElementById('slotDateLabel').textContent = dateLabel(slotDate); fetchSlots(); }

    async function fetchSlots() {
      const el = document.getElementById('slotContent');
      el.innerHTML = '<div class="loading">読み込み中...</div>';
      try {
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_reservations', date: slotDate, key: enteredPin })
        });
        const data = await res.json();
        if (data.error === 'Unauthorized') { logout(); return; }
        if (!data.success) { el.innerHTML = '<div class="no-data">データの取得に失敗しました。</div>'; return; }
        renderSlots(data.slots || {});
      } catch(e) {
        el.innerHTML = '<div class="no-data">通信エラーが発生しました。</div>';
      }
    }

    function renderSlots(slots) {
      const el = document.getElementById('slotContent');
      let html = `<div class="slot-mgmt-grid">`;

      DINNER_TIMES.forEach(time => {
        const sd      = slots[time] || { table2: null, table6left: null, table6right: null, table6full: null, fullBooking: false, manualBlock: false };
        const blocked = !!sd.manualBlock;
        const statusText = blocked ? '受付停止中' : (canAccommodate(sd, 1) ? '受付中' : '満席（予約済み）');

        html += `
          <div class="slot-mgmt-card ${blocked ? 'blocked' : ''}">
            <div class="slot-mgmt-time">${time}</div>
            <div class="slot-mgmt-status ${blocked ? 'is-blocked' : ''}">状態: ${statusText}</div>
            <button
              class="block-btn ${blocked ? 'do-unblock' : 'do-block'}"
              onclick="toggleBlock('${time}', ${!blocked})"
            >${blocked ? '✅ 受付を再開する' : '🚫 この枠をブロック'}</button>
          </div>
        `;
      });

      html += `</div>`;
      el.innerHTML = html;
    }

    async function toggleBlock(time, block) {
      const label = block ? 'ブロック（受付停止）' : '受付再開';
      if (!confirm(`${slotDate} ${time} を${label}しますか？`)) return;

      try {
        const res  = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'admin_block_slot', key: enteredPin, date: slotDate, time, block })
        });
        const data = await res.json();
        if (data.success) fetchSlots();
        else alert('操作に失敗しました: ' + (data.message || '不明なエラー'));
      } catch(e) {
        alert('通信エラーが発生しました。');
      }
    }

    // ============================================================
    // SEAT LOGIC (gas-code.js と同一ロジック・同期必須)
    // ============================================================
    function canAccommodate(slotData, partySize) {
      if (slotData.manualBlock) return false;
      if (slotData.fullBooking) return false;
      const table2Occupied = slotData.table2 != null;
      const leftOccupied   = slotData.table6left != null;
      const rightOccupied  = slotData.table6right != null;
      const fullOccupied   = slotData.table6full != null
                          || (leftOccupied && slotData.table6left >= 3);
      const groups6 = [leftOccupied, rightOccupied, slotData.table6full != null].filter(Boolean).length;
      const totalGroups = (table2Occupied ? 1 : 0) + groups6;
      if (partySize >= 7) return !table2Occupied && groups6 === 0;
      if (partySize >= 5) return groups6 === 0;
      if (partySize >= 3) return groups6 === 0;
      if (totalGroups >= 3) return false;
      if (fullOccupied) return !table2Occupied;
      if (!table2Occupied) return true;
      if (!rightOccupied && groups6 < 2) return true;
      if (!leftOccupied && groups6 < 2) return true;
      return false;
    }
  </script>
</body>
</html>
